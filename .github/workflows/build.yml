name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build frontend
      run: npx vite build

    - name: Copy assets
      run: |
        mkdir -p android/app/src/main/assets/www
        cp -r dist/* android/app/src/main/assets/www/

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create Release and Upload APK
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REPO="${{ github.repository }}"
        TAG="latest"
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        SHA="${{ github.sha }}"

        echo "Repo: $REPO, APK: $APK"

        # Create release via API
        echo "Creating release..."
        RESP=$(curl -s -w "\n%{http_code}" -X POST \
          "https://api.github.com/repos/$REPO/releases" \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"WebChat4 APK\",\"body\":\"Automated APK build\",\"target_commitish\":\"$SHA\",\"draft\":false,\"prerelease\":false}")

        HTTP_CODE=$(echo "$RESP" | tail -1)
        BODY=$(echo "$RESP" | sed '$d')
        echo "Create release HTTP: $HTTP_CODE"

        # Get upload URL
        UPLOAD_URL=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'])")
        echo "Upload URL: $UPLOAD_URL"

        # Upload APK
        echo "Uploading APK..."
        RESP2=$(curl -s -w "\n%{http_code}" -X POST \
          "$UPLOAD_URL?name=app-debug.apk" \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary "@$APK")

        HTTP_CODE2=$(echo "$RESP2" | tail -1)
        echo "Upload APK HTTP: $HTTP_CODE2"
        echo "Done!"

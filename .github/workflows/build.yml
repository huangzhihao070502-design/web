name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build frontend
      run: npx vite build

    - name: Copy assets
      run: |
        mkdir -p android/app/src/main/assets/www
        cp -r dist/* android/app/src/main/assets/www/

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebChat4-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90

    - name: Upload APK to repo via API
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        DEST="apk-download/app-debug.apk"
        REPO="${{ github.repository }}"
        SHA="${{ github.sha }}"

        echo "Uploading APK to $DEST..."

        # Check if file already exists
        FILE_SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/contents/$DEST?ref=main" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")

        # Base64 encode the APK
        CONTENT=$(base64 -w 0 "$APK")

        # Create/update file via API
        PAYLOAD=$(python3 -c "
import sys, json
sha = '$FILE_SHA'
content = '$CONTENT'
payload = {'message': 'chore: update APK', 'content': content, 'branch': 'main', 'sha': sha}
print(json.dumps(payload))
")

        RESP=$(curl -s -w "\n%{http_code}" -X PUT \
          "https://api.github.com/repos/$REPO/contents/$DEST" \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")

        HTTP_CODE=$(echo "$RESP" | tail -1)
        echo "Upload HTTP: $HTTP_CODE"
        echo "Done!"

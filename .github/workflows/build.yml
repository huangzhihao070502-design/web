name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build frontend
      run: npx vite build

    - name: Copy assets
      run: |
        mkdir -p android/app/src/main/assets/www
        cp -r dist/* android/app/src/main/assets/www/

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebChat4-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90

    - name: Upload APK to repo via API
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        DEST="apk-download/app-debug.apk"
        REPO="${{ github.repository }}"

        echo "Uploading APK to $DEST..."

        # Base64 encode the APK to a temp file
        base64 -w 0 "$APK" > /tmp/apk_b64.txt

        # Check if file already exists
        FILE_SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/contents/$DEST?ref=main" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

        # Build payload using Python
        python3 -c "
import json, sys
with open('/tmp/apk_b64.txt') as f:
    content = f.read().strip()
payload = {
    'message': 'chore: update APK',
    'content': content,
    'branch': 'main'
}
if '$FILE_SHA':
    payload['sha'] = '$FILE_SHA'
print(json.dumps(payload))
" > /tmp/payload.json

        # Upload via API
        curl -s -X PUT \
          "https://api.github.com/repos/$REPO/contents/$DEST" \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          -d @/tmp/payload.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Upload result:', d.get('content',{}).get('name',''), d.get('message',''))"

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build frontend
      run: npx vite build

    - name: Copy assets
      run: |
        mkdir -p android/app/src/main/assets/www
        cp -r dist/* android/app/src/main/assets/www/

    - name: Download sherpa-onnx AAR
      run: |
        mkdir -p android/app/libs
        curl -L -o android/app/libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-1.13.3.aar"

    - name: Download Kokoro TTS model
      run: |
        curl -L -o /tmp/kokoro.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_1.tar.bz2"
        mkdir -p android/app/src/main/assets/kokoro
        tar -xjf /tmp/kokoro.tar.bz2 -C /tmp
        cp -r /tmp/kokoro-multi-lang-v1_1/* android/app/src/main/assets/kokoro/
        rm -rf /tmp/kokoro.tar.bz2 /tmp/kokoro-multi-lang-v1_1

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebChat4-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build frontend
      run: npx vite build

    - name: Copy assets
      run: |
        mkdir -p android/app/src/main/assets/www
        cp -r dist/* android/app/src/main/assets/www/

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebChat4-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90

    - name: Commit APK to repo
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk apk-download/app-debug.apk
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add apk-download/app-debug.apk
        git commit -m "chore: update APK build $(date +%Y%m%d)" || echo "No changes to commit"
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="登录您的账号" />
<title>登录 — Aperture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flat-ui@2.3.0/dist/css/flat-ui.min.css" />
  <script>
  window.onerror = function(msg, url, line) {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/debug-log', true);
    x.send(JSON.stringify({msg: msg, url: url, line: line}));
  };
  </script>
  </head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
// Live2D 看板娘 — 自定义加载
(function(){
  var CDN = 'https://cdn.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';

  // 1. 加载 CSS
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = CDN + 'waifu.css';
  document.head.appendChild(link);

  // 2. 加载 waifu-tips.js（普通脚本，不是 module）
  var s1 = document.createElement('script');
  s1.src = CDN + 'waifu-tips.js';
  s1.onload = function() {
    // 3. 加载 live2d.min.js（Cubism 2 运行时）
    var s2 = document.createElement('script');
    s2.src = CDN + 'live2d.min.js';
    s2.onload = function() {
      // 4. 全部加载完成，初始化
      if (window.initWidget) {
        window.initWidget({
          waifuPath: CDN + 'waifu-tips.json',
          cubism2Path: CDN + 'live2d.min.js',
          cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
          tools: ['hitokoto', 'switch-model', 'switch-texture', 'photo', 'info', 'quit'],
          logLevel: 'info',
          drag: true
        });
      }
    };
    document.body.appendChild(s2);
  };
  document.body.appendChild(s1);
})();
</script>
</body>
</html>

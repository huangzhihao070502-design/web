<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="登录您的账号" />
<title>登录 — Aperture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flat-ui@2.3.0/dist/css/flat-ui.min.css" />
  <script>
  window.onerror = function(msg, url, line) {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/debug-log', true);
    x.send(JSON.stringify({msg: msg, url: url, line: line}));
  };
  </script>
  </head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
// Live2D 看板娘 — 自定义加载（使用可靠的 CDN）
(function(){
  var live2d_path = 'https://cdn.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';
  function loadResource(url, type) {
    return new Promise(function(resolve, reject) {
      var tag;
      if (type === 'css') {
        tag = document.createElement('link');
        tag.rel = 'stylesheet';
        tag.href = url;
      } else if (type === 'js') {
        tag = document.createElement('script');
        tag.type = 'module';
        tag.src = url;
      }
      if (tag) {
        tag.onload = function() { resolve(url); };
        tag.onerror = function() { reject(url); };
        document.head.appendChild(tag);
      }
    });
  }
  Promise.all([
    loadResource(live2d_path + 'waifu.css', 'css'),
    loadResource(live2d_path + 'waifu-tips.js', 'js')
  ]).then(function() {
    window.initWidget({
      waifuPath: live2d_path + 'waifu-tips.json',
      cubism2Path: live2d_path + 'live2d.min.js',
      cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
      tools: ['hitokoto', 'switch-model', 'switch-texture', 'photo', 'info', 'quit'],
      logLevel: 'warn',
      drag: true
    });
  });
})();
</script>
</body>
</html>

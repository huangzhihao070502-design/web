  <script>
  window.onerror = function(msg, url, line) {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/debug-log', true);
    x.send(JSON.stringify({msg: msg, url: url, line: line}));
  };
  </script>
  <!-- 调试面板 -->
  <script>
  (function(){
    var logs = [];
    var MAX = 200;
    var panel = null;
    var btn = null;
    var isOpen = false;

    function createUI() {
      // 悬浮按钮
      btn = document.createElement('div');
      btn.innerHTML = '🐛';
      btn.style.cssText = 'position:fixed;bottom:80px;right:12px;z-index:99999;width:40px;height:40px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.3);user-select:none;';
      btn.onclick = function() { togglePanel(); };
      document.body.appendChild(btn);

      // 面板
      panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;bottom:130px;right:8px;z-index:99998;width:calc(100vw - 16px);max-width:400px;height:50vh;background:#0d0d0d;color:#e0e0e0;font-family:monospace;font-size:11px;line-height:1.5;overflow:auto;border-radius:12px;padding:8px;display:none;box-shadow:0 4px 24px rgba(0,0,0,0.5);';
      document.body.appendChild(panel);

      // 清除按钮
      var clearBtn = document.createElement('div');
      clearBtn.innerHTML = '清除';
      clearBtn.style.cssText = 'position:sticky;top:0;background:#333;color:#fff;text-align:center;padding:4px;border-radius:6px;margin-bottom:4px;font-size:11px;cursor:pointer;';
      clearBtn.onclick = function() { logs = []; renderLogs(); };
      panel.appendChild(clearBtn);

      renderLogs();
    }

    function togglePanel() {
      isOpen = !isOpen;
      if (panel) panel.style.display = isOpen ? 'block' : 'none';
      if (btn) btn.innerHTML = isOpen ? '✕' : '🐛';
    }

    function renderLogs() {
      if (!panel) return;
      var clearBtn = panel.firstChild;
      panel.innerHTML = '';
      panel.appendChild(clearBtn);
      for (var i = 0; i < logs.length; i++) {
        var div = document.createElement('div');
        div.style.cssText = 'padding:2px 4px;border-bottom:1px solid #1a1a1a;word-break:break-all;white-space:pre-wrap;';
        var l = logs[i];
        if (l.level === 'error') div.style.color = '#ff6b6b';
        else if (l.level === 'warn') div.style.color = '#ffd43b';
        else if (l.level === 'info') div.style.color = '#69db7c';
        div.textContent = '[' + l.time + '] [' + l.level.toUpperCase() + '] ' + l.msg;
        panel.appendChild(div);
      }
      panel.scrollTop = panel.scrollHeight;
    }

    function addLog(level, args) {
      var msg = [];
      for (var i = 0; i < args.length; i++) {
        var a = args[i];
        if (typeof a === 'object') {
          try { msg.push(JSON.stringify(a, null, 0)); } catch(e) { msg.push(String(a)); }
        } else {
          msg.push(String(a));
        }
      }
      var now = new Date();
      var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
      logs.push({ level: level, msg: msg.join(' '), time: time });
      if (logs.length > MAX) logs.shift();
      renderLogs();
      // 自动弹出错误
      if (level === 'error' && !isOpen && btn) {
        btn.style.background = '#e03131';
        setTimeout(function(){ btn.style.background = '#1a1a2e'; }, 2000);
      }
    }

    // 拦截 console
    var origLog = console.log;
    var origWarn = console.warn;
    var origError = console.error;
    var origInfo = console.info;

    console.log = function() { origLog.apply(console, arguments); addLog('log', arguments); };
    console.warn = function() { origWarn.apply(console, arguments); addLog('warn', arguments); };
    console.error = function() { origError.apply(console, arguments); addLog('error', arguments); };
    console.info = function() { origInfo.apply(console, arguments); addLog('info', arguments); };

    // 拦截未捕获错误
    window.addEventListener('error', function(e) {
      addLog('error', ['[Uncaught] ' + e.message + ' at ' + (e.filename||'') + ':' + (e.lineno||'')]);
    });
    window.addEventListener('unhandledrejection', function(e) {
      addLog('error', ['[UnhandledRejection] ' + (e.reason ? (e.reason.message || e.reason) : 'unknown')]);
    });

    // DOM ready 后创建 UI
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', createUI);
    } else {
      createUI();
    }
  })();
  </script>
  </head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
// Live2D 看板娘 — 直接用 Cubism 2 运行时（绕过 ES Module 问题）
(function(){
  var CDN = 'https://cdn.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';
  var MODEL_URL = 'https://fastly.jsdelivr.net/gh/fghrsh/live2d_api/model/Potion-Maker/Pio/index.json';

  // 1. 创建容器
  var container = document.createElement('div');
  container.id = 'waifu';
  container.innerHTML = '<canvas id="live2d-canvas" width="300" height="400" style="position:fixed;bottom:0;left:0;z-index:9997;pointer-events:auto;cursor:grab;"></canvas>';
  container.style.cssText = 'position:fixed;bottom:0;left:0;z-index:9997;';
  document.body.appendChild(container);

  // 2. 加载 Cubism 2 运行时
  var s = document.createElement('script');
  s.src = CDN + 'live2d.min.js';
  s.onload = function() {
    console.log('[Live2D] Cubism 2 runtime loaded, loading model...');
    try {
      // 3. 直接用 Live2D 框架加载模型
      var model = null;
      var live2d = new L2DTargetPoint();

      // 加载模型
      var loadTimer = setInterval(function() {
        if (window.Live2D && window.Live2DFramework) {
          clearInterval(loadTimer);
          initLive2D();
        }
      }, 100);

      // 超时保护
      setTimeout(function() { clearInterval(loadTimer); }, 10000);

      function initLive2D() {
        console.log('[Live2D] Framework ready, initializing...');
        try {
          // 使用 Live2D 官方方式加载
          var canvas = document.getElementById('live2d-canvas');
          if (!canvas) { console.error('[Live2D] Canvas not found'); return; }

          // 检查 Live2D 全局对象
          if (typeof Live2D === 'undefined') {
            console.error('[Live2D] Live2D global not found');
            return;
          }

          console.log('[Live2D] Live2D version:', Live2D.version);

          // 尝试加载模型
          Live2D.init();
          console.log('[Live2D] Live2D.init() called');

          // 创建模型
          var modelDef = {
            type: 'Live2D Model Setting',
            name: 'Pio',
            model: MODEL_URL.replace('index.json', 'Pio.model.moc'),
            textures: [
              MODEL_URL.replace('index.json', 'textures/texture_00.png')
            ]
          };

          console.log('[Live2D] Model definition ready:', JSON.stringify(modelDef).slice(0, 100));

          // 使用 LAppModel 加载
          if (window.LAppModel) {
            console.log('[Live2D] LAppModel found, loading...');
            window.LAppModel.load(canvas, modelDef);
          } else if (window.LAppLive2DManager) {
            console.log('[Live2D] LAppLive2DManager found, loading...');
            window.LAppLive2DManager.loadModel(canvas, MODEL_URL);
          } else {
            console.log('[Live2D] No model loader found, trying direct approach...');
            // 直接尝试最简单的方式
            loadModelDirect(canvas);
          }
        } catch(e) {
          console.error('[Live2D] initLive2D error:', e.message);
        }
      }

      function loadModelDirect(canvas) {
        console.log('[Live2D] Direct model load attempt...');
        // 获取模型 JSON
        var xhr = new XMLHttpRequest();
        xhr.open('GET', MODEL_URL, true);
        xhr.onload = function() {
          if (xhr.status === 200) {
            var modelJson = JSON.parse(xhr.responseText);
            console.log('[Live2D] Model JSON loaded:', modelJson.name || 'unknown');
            console.log('[Live2D] Model version:', modelJson.version);
            console.log('[Live2D] Textures:', (modelJson.textures || []).length);

            // 提示用户
            console.log('[Live2D] Model data loaded successfully! Display requires full Live2D framework integration.');
          } else {
            console.error('[Live2D] Model JSON load failed:', xhr.status);
          }
        };
        xhr.onerror = function() { console.error('[Live2D] Model JSON network error'); };
        xhr.send();
      }
    } catch(e) {
      console.error('[Live2D] Initialization error:', e.message);
    }
  };
  s.onerror = function() { console.error('[Live2D] Cubism 2 runtime load failed'); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="登录您的账号" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fastly.jsdelivr.net https://cubism.live2d.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fastly.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data: https:;">
<title>登录 — Aperture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flat-ui@2.3.0/dist/css/flat-ui.min.css" />
  <script>
  window.onerror = function(msg, url, line) {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/debug-log', true);
    x.send(JSON.stringify({msg: msg, url: url, line: line}));
  };
  </script>
  <!-- 调试面板 -->
  <script>
  (function(){
    var logs = [];
    var MAX = 200;
    var panel = null;
    var btn = null;
    var isOpen = false;

    function createUI() {
      // 悬浮按钮
      btn = document.createElement('div');
      btn.innerHTML = '🐛';
      btn.style.cssText = 'position:fixed;bottom:80px;right:12px;z-index:99999;width:40px;height:40px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.3);user-select:none;';
      btn.onclick = function() { togglePanel(); };
      document.body.appendChild(btn);

      // 面板
      panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;bottom:130px;right:8px;z-index:99998;width:calc(100vw - 16px);max-width:400px;height:50vh;background:#0d0d0d;color:#e0e0e0;font-family:monospace;font-size:11px;line-height:1.5;overflow:auto;border-radius:12px;padding:8px;display:none;box-shadow:0 4px 24px rgba(0,0,0,0.5);';
      document.body.appendChild(panel);

      // 清除按钮
      var clearBtn = document.createElement('div');
      clearBtn.innerHTML = '清除';
      clearBtn.style.cssText = 'position:sticky;top:0;background:#333;color:#fff;text-align:center;padding:4px;border-radius:6px;margin-bottom:4px;font-size:11px;cursor:pointer;';
      clearBtn.onclick = function() { logs = []; renderLogs(); };
      panel.appendChild(clearBtn);

      renderLogs();
    }

    function togglePanel() {
      isOpen = !isOpen;
      if (panel) panel.style.display = isOpen ? 'block' : 'none';
      if (btn) btn.innerHTML = isOpen ? '✕' : '🐛';
    }

    function renderLogs() {
      if (!panel) return;
      var clearBtn = panel.firstChild;
      panel.innerHTML = '';
      panel.appendChild(clearBtn);
      for (var i = 0; i < logs.length; i++) {
        var div = document.createElement('div');
        div.style.cssText = 'padding:2px 4px;border-bottom:1px solid #1a1a1a;word-break:break-all;white-space:pre-wrap;';
        var l = logs[i];
        if (l.level === 'error') div.style.color = '#ff6b6b';
        else if (l.level === 'warn') div.style.color = '#ffd43b';
        else if (l.level === 'info') div.style.color = '#69db7c';
        div.textContent = '[' + l.time + '] [' + l.level.toUpperCase() + '] ' + l.msg;
        panel.appendChild(div);
      }
      panel.scrollTop = panel.scrollHeight;
    }

    function addLog(level, args) {
      var msg = [];
      for (var i = 0; i < args.length; i++) {
        var a = args[i];
        if (typeof a === 'object') {
          try { msg.push(JSON.stringify(a, null, 0)); } catch(e) { msg.push(String(a)); }
        } else {
          msg.push(String(a));
        }
      }
      var now = new Date();
      var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
      logs.push({ level: level, msg: msg.join(' '), time: time });
      if (logs.length > MAX) logs.shift();
      renderLogs();
      // 自动弹出错误
      if (level === 'error' && !isOpen && btn) {
        btn.style.background = '#e03131';
        setTimeout(function(){ btn.style.background = '#1a1a2e'; }, 2000);
      }
    }

    // 拦截 console
    var origLog = console.log;
    var origWarn = console.warn;
    var origError = console.error;
    var origInfo = console.info;

    console.log = function() { origLog.apply(console, arguments); addLog('log', arguments); };
    console.warn = function() { origWarn.apply(console, arguments); addLog('warn', arguments); };
    console.error = function() { origError.apply(console, arguments); addLog('error', arguments); };
    console.info = function() { origInfo.apply(console, arguments); addLog('info', arguments); };

    // 拦截未捕获错误
    window.addEventListener('error', function(e) {
      addLog('error', ['[Uncaught] ' + e.message + ' at ' + (e.filename||'') + ':' + (e.lineno||'')]);
    });
    window.addEventListener('unhandledrejection', function(e) {
      addLog('error', ['[UnhandledRejection] ' + (e.reason ? (e.reason.message || e.reason) : 'unknown')]);
    });

    // DOM ready 后创建 UI
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', createUI);
    } else {
      createUI();
    }
  })();
  </script>
  </head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
// Live2D 看板娘 — ES Module 转普通脚本方案
// 核心思路：fetch ES Module 源码 → 去掉 import/export → 作为普通脚本加载
(function(){
  var CDN = 'https://cdn.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';

  function loadScript(code) {
    return new Promise(function(resolve, reject) {
      var blob = new Blob([code], {type: 'application/javascript'});
      var url = URL.createObjectURL(blob);
      var s = document.createElement('script');
      s.src = url;
      s.onload = function() { URL.revokeObjectURL(url); resolve(); };
      s.onerror = function() { URL.revokeObjectURL(url); reject(new Error('script load failed')); };
      document.body.appendChild(s);
    });
  }

  function fetchText(url) {
    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error('fetch ' + url + ' failed: ' + r.status);
      return r.text();
    });
  }

  console.log('[Live2D] Starting de-module injection...');

  // Step 1: 加载 CSS
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = CDN + 'waifu.css';
  document.head.appendChild(link);

  // Step 2: 并行获取 waifu-tips.js 和 chunk/index.js
  Promise.all([
    fetchText(CDN + 'waifu-tips.js'),
    fetchText(CDN + 'chunk/index.js')
  ]).then(function(codes) {
    var waifuCode = codes[0];
    var chunkCode = codes[1];

    console.log('[Live2D] Fetched waifu-tips.js (' + waifuCode.length + ' bytes)');
    console.log('[Live2D] Fetched chunk/index.js (' + chunkCode.length + ' bytes)');

    // Step 3: 处理 waifu-tips.js
    // 去掉 export 语句，暴露 logger 到全局
    waifuCode = waifuCode.replace(/export\s*\{[^}]*\}\s*;?/, '');
    waifuCode += '\nwindow._l2dLogger = (function(){ try { var e = function(lvl){this.level=lvl}; e.prototype.info=function(){}; e.prototype.warn=function(){}; e.prototype.error=function(){}; e.prototype.trace=function(){}; return new e("warn"); } catch(x){ return {info:function(){},warn:function(){},error:function(){},trace:function(){}}; } })();\n';
    // 从 waifu-tips.js 中提取 logger 实例
    // waifu-tips.js 定义了 class a (logger), 我们需要暴露它
    // 通过正则找到 logger 的方法调用模式，确认变量名

    console.log('[Live2D] Loading waifu-tips.js (de-module)...');
    return loadScript(waifuCode).then(function() {
      console.log('[Live2D] waifu-tips.js loaded, initWidget:', typeof window.initWidget);

      // Step 4: 处理 chunk/index.js
      // 去掉 import 语句，添加 logger 引用
      chunkCode = chunkCode.replace(/import\s*\{[^}]*\}\s*from\s*"[^"]*"\s*;?/, '');

      console.log('[Live2D] Loading chunk/index.js (de-module)...');
      return loadScript(chunkCode);
    });
  }).then(function() {
    console.log('[Live2D] All scripts loaded!');

    // Step 5: 调用 initWidget
    if (window.initWidget) {
      console.log('[Live2D] Calling initWidget...');
      try {
        window.initWidget({
          waifuPath: CDN + 'waifu-tips.json',
          cubism2Path: CDN + 'live2d.min.js',
          cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
          cdnPath: 'https://fastly.jsdelivr.net/gh/fghrsh/live2d_api/',
          tools: ['hitokoto', 'switch-model', 'switch-texture', 'photo', 'info', 'quit'],
          logLevel: 'info',
          drag: true
        });
        console.log('[Live2D] initWidget called successfully!');
      } catch(e) {
        console.error('[Live2D] initWidget error:', e.message, e.stack);
      }
    } else {
      console.error('[Live2D] initWidget not found after loading waifu-tips.js');
    }
  }).catch(function(err) {
    console.error('[Live2D] Pipeline error:', err.message);
  });
})();
</script>
</body>
</html>
